<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9d8e6">
  <title>аткрытка</title>
  <link rel="stylesheet" href="style.css">
  <script src="text.js" defer></script>
  <script src="card.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="story">
      <div class="scene">
        <span class="sparkle sparkle-top" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-bottom" aria-hidden="true">✧</span>
        <button class="pusheen" type="button" aria-label="Нажать на Пушина, чтобы он заговорил">
          <img src="pusheen.gif" alt="" width="480" height="480">
        </button>
      </div>
      <div class="dialog-slot">
        <div class="dialog" id="dialog" aria-hidden="true" hidden>
          <p id="line"></p>
          <span class="next" aria-hidden="true">▾</span>
        </div>
        <p class="screen-reader" id="announcement" aria-live="polite" aria-atomic="true"></p>
      </div>
    </div>
  </main>
</body>
</html>
